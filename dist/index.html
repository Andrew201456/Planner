<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="Το προσωπικό σου σημειωματάριο με χρωματιστά τετράδια, λίστες και ημερολόγιο.">
  <title>Planner</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>(function(){
  "use strict";
  const key="planner.theme.v1",root=document.documentElement;
  const media=window.matchMedia("(prefers-color-scheme: dark)");
  let preference=null;
  try{const saved=localStorage.getItem(key);if(saved==="dark"||saved==="light")preference=saved;}catch{}
  function apply(){
    const dark=(preference|| (media.matches?"dark":"light"))==="dark";
    root.dataset.theme=dark?"dark":"light";
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.content=dark?"#0f172a":"#faf9f5";
    for(const button of document.querySelectorAll("[data-theme-toggle]")){
      const label=dark?"Φωτεινή εμφάνιση":"Σκούρα εμφάνιση";
      button.setAttribute("aria-label",label);
      button.title=label;
      button.setAttribute("aria-pressed",String(dark));
    }
  }
  apply();
  document.addEventListener("DOMContentLoaded",()=>{
    apply();
    document.querySelectorAll("[data-theme-toggle]").forEach(button=>button.addEventListener("click",()=>{
      preference=root.dataset.theme==="dark"?"light":"dark";
      try{localStorage.setItem(key,preference);}catch{}
      apply();
    }));
  });
  if(media.addEventListener)media.addEventListener("change",()=>{if(!preference)apply()});
  else media.addListener?.(()=>{if(!preference)apply()});
  window.addEventListener("storage",event=>{
    if(event.key===key){preference=["dark","light"].includes(event.newValue)?event.newValue:null;apply();}
  });
})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..800&amp;display=swap">
  <link rel="stylesheet" href="./style.css">
  <style>
    .login-screen{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .login-card{width:min(100%,380px);display:grid;gap:17px;padding:32px 26px;background:#fffefa;border:1px solid #dedacf;border-radius:20px;box-shadow:0 12px 45px #25354d10}
    .remember-login{display:flex;align-items:center;gap:9px;font-size:.9rem;cursor:pointer}.remember-login input{width:19px;height:19px;accent-color:#294e95;margin:0}
    .login-card img{margin:auto}.login-card h1,.login-card>p{text-align:center}.login-card h1{font-size:2.4rem;color:#243c64}.login-card>p{font-size:.9rem;color:#606975}.login-card .primary{width:100%}
  </style>
  <script src="./app.js" defer></script>
</head>
<body>
  <section id="login-screen" hidden class="login-screen">
    <form id="login-form" class="login-card">
      <button type="button" class="theme-toggle login-theme" data-theme-toggle aria-label="Σκούρα εμφάνιση" aria-pressed="false" title="Σκούρα εμφάνιση"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14a8.7 8.7 0 0 1-10.5-10.5A8.7 8.7 0 1 0 20.5 14Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg></button>
      <img src="./icon.svg" alt="" width="64" height="64">
      <h1>Planner</h1>
      <p>Συνδέσου για να ανοίξεις τις σημειώσεις σου.</p>
      <label class="field">Username<input id="login-username" type="text" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
      <label class="field">Password<input id="login-password" type="password" autocomplete="current-password" required></label>
      <label class="remember-login"><input id="login-remember" type="checkbox" checked> Να με θυμάσαι</label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="primary" id="login-submit">Σύνδεση</button>
    </form>
  </section>
  <div id="planner-shell" hidden>
  <a class="skip" href="#content">Μετάβαση στο περιεχόμενο</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#notes" aria-label="Planner, αρχική"><img src="./icon.svg" alt="" width="40" height="40"><span>Planner</span></a>
      <nav class="main-nav" aria-label="Κύρια πλοήγηση">
        <a href="#notes" id="nav-notes" aria-current="page"><svg aria-hidden="true"><use href="./icons.svg#pages"/></svg>Σημειώσεις</a>
        <a href="#calendar" id="nav-calendar"><svg aria-hidden="true"><use href="./icons.svg#calendar"/></svg>Ημερολόγιο</a>
        <a href="#food" id="nav-food"><svg aria-hidden="true"><use href="./icons.svg#food"/></svg>Τι τρώω</a>
      </nav>
      <a class="date-shortcut" id="today-shortcut" href="#calendar"><svg aria-hidden="true"><use href="./icons.svg#calendar"/></svg><span></span></a>
      <button type="button" class="refresh-button" id="soft-refresh" aria-label="Συγχρονισμός με Cloudflare" title="Ανανέωση από Cloudflare" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.6-2L20 12M4 12l2.3 6A7 7 0 0 0 17.9 16"/></svg></button>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Σκούρα εμφάνιση" aria-pressed="false" title="Σκούρα εμφάνιση"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14a8.7 8.7 0 0 1-10.5-10.5A8.7 8.7 0 1 0 20.5 14Z"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg></button>
      <button type="button" id="logout" class="devices-button" aria-label="Αποσύνδεση" title="Αποσύνδεση"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg><span>Αποσύνδεση</span></button>
    </div>
  </header>
  <p class="sync-status" id="sync-status" role="status" hidden></p>
  <main id="content" tabindex="-1"></main>
  <noscript>Ενεργοποίησε τη JavaScript για να ανοίξεις το Planner.</noscript>
  <p class="toast" id="toast" role="status" hidden></p>

  <dialog id="note-dialog" aria-labelledby="note-heading">
    <form id="note-form">
      <div class="sheet-head">
        <h2 id="note-heading">Νέα σημείωση</h2>
        <button class="icon-button" type="button" data-close aria-label="Κλείσιμο"><svg aria-hidden="true"><use href="./icons.svg#close"/></svg></button>
      </div>
      <div class="sheet-body">
        <fieldset class="type-picker">
          <legend class="sr-only">Είδος σημείωσης</legend>
          <label><input type="radio" name="kind" value="text" checked><span><svg aria-hidden="true"><use href="./icons.svg#text"/></svg>Κείμενο</span></label>
          <label><input type="radio" name="kind" value="list"><span><svg aria-hidden="true"><use href="./icons.svg#list"/></svg>Λίστα</span></label>
        </fieldset>
        <label class="field">Τίτλος <input id="note-title" type="text" maxlength="160" placeholder="Τίτλος (προαιρετικά)"></label>
        <label class="field"><span id="body-label">Σημείωση</span><textarea id="note-body" rows="5" maxlength="20000" placeholder="Γράψε εδώ…"></textarea></label>
        <div class="meta-fields">
          <label class="field">Τετράδιο <select id="note-book"></select></label>
          <label class="field">Ημερομηνία <input id="note-date" type="date" min="0001-01-01" max="9999-12-31"></label>
        </div>
        <p class="form-error" id="note-error" role="alert" hidden></p>
      </div>
      <div class="sheet-actions">
        <button type="button" class="delete-button" id="delete-note" hidden><svg aria-hidden="true"><use href="./icons.svg#trash"/></svg>Διαγραφή</button>
        <button type="submit" class="primary">Αποθήκευση</button>
      </div>
    </form>
  </dialog>
  <dialog id="food-dialog" aria-labelledby="food-heading">
    <form id="food-form">
      <div class="sheet-head"><h2 id="food-heading">Νέα καταχώρηση φαγητού</h2><button class="icon-button" type="button" data-close aria-label="Κλείσιμο"><svg aria-hidden="true"><use href="./icons.svg#close"/></svg></button></div>
      <div class="sheet-body">
        <label class="field">Τι έφαγες; <input id="food-name" maxlength="300" required placeholder="π.χ. Τοστ με τυρί"></label>
        <label class="field">Θερμίδες (προαιρετικά) <input id="food-calories" type="number" min="0" max="100000" step="1" inputmode="numeric" placeholder="kcal"></label>
        <label class="field">Ημερομηνία <input id="food-date" type="date" min="0001-01-01" max="9999-12-31" required></label>
        <p class="form-error" id="food-error" role="alert" hidden></p>
      </div>
      <div class="sheet-actions"><button type="button" class="delete-button" id="delete-food" hidden><svg aria-hidden="true"><use href="./icons.svg#trash"/></svg>Διαγραφή</button><button type="submit" class="primary">Αποθήκευση</button></div>
    </form>
  </dialog>
  <dialog id="book-dialog" aria-labelledby="book-heading">
    <form id="book-form">
      <div class="sheet-head">
        <h2 id="book-heading">Νέο τετράδιο</h2>
        <button class="icon-button" type="button" data-close aria-label="Κλείσιμο"><svg aria-hidden="true"><use href="./icons.svg#close"/></svg></button>
      </div>
      <div class="sheet-body">
        <label class="field">Όνομα <input type="text" id="book-name" maxlength="45" placeholder="π.χ. Εκδρομές" required></label>
        <fieldset class="colors"><legend>Χρώμα εξωφύλλου</legend><div id="color-options"></div></fieldset>
        <p class="form-error" id="book-error" role="alert" hidden></p>
      </div>
      <div class="sheet-actions"><button type="submit" class="primary">Δημιουργία</button></div>
    </form>
  </dialog>
  </div>
</body>
</html>
